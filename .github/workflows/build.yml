name: Build XorPlay Tesla Overlay

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download libtesla
        run: |
          mkdir -p libs/libtesla
          curl -L https://github.com -o tesla.zip
          unzip -q tesla.zip
          cp -r libtesla-master/* libs/libtesla/

      - name: Compile OVL
        run: |
          make
          mkdir -p out/switch/.overlays
          cp xorplay.ovl out/switch/.overlays/

      - name: Upload OVL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XorPlay-Tesla-Overlay
          path: out/
          
